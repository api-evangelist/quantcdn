aid: quantcdn
name: QuantCDN
description: QuantCDN is an edge delivery, static site hosting, and cloud applications platform that lets teams generate,
  host, and maintain static and dynamic versions of their websites with a global CDN, WAF, edge functions, key-value storage,
  AI inference, and DNS management.
