openapi: 3.2.0
info:
  description: Unified API for QuantCDN Admin and QuantCloud Platform services
  title: QuantCDN Applications API
  version: 4.15.8
servers:
- description: QuantCDN Public Cloud
  url: https://dashboard.quantcdn.io
- description: QuantGov Cloud
  url: https://dash.quantgov.cloud
security:
- BearerAuth: []
tags:
- description: Cloud application lifecycle management
  name: Applications
paths:
  /api/v3/organizations/{organisation}/applications:
    get:
      operationId: listApplications
      parameters:
      - description: The organisation ID
        explode: false
        in: path
        name: organisation
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Application'
                type: array
          description: A list of applications
      summary: Get all applications for an organisation
      tags:
      - Applications
    post:
      operationId: createApplication
      parameters:
      - description: The organisation ID
        explode: false
        in: path
        name: organisation
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The created application
        '400':
          description: The request is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createApplication_403_response'
          description: Application limit reached - organisation has reached the maximum number of allowed applications
      summary: Create a new application
      tags:
      - Applications
  /api/v3/organizations/{organisation}/applications/{application}:
    delete:
      operationId: deleteApplication
      parameters:
      - description: The organisation ID
        explode: false
        in: path
        name: organisation
        required: true
        schema:
          type: string
        style: simple
      - description: The application ID
        explode: false
        in: path
        name: application
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: The application deleted
        '404':
          description: The application not found
      summary: Delete an application
      tags:
      - Applications
    get:
      operationId: getApplication
      parameters:
      - description: The organisation ID
        explode: false
        in: path
        name: organisation
        required: true
        schema:
          type: string
        style: simple
      - description: The application ID
        explode: false
        in: path
        name: application
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application
        '404':
          description: The application not found
      summary: Get a single application
      tags:
      - Applications
  /api/v3/organizations/{organisation}/applications/ecr-login:
    get:
      operationId: getEcrLoginCredentials
      parameters:
      - description: The organisation ID
        explode: false
        in: path
        name: organisation
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getEcrLoginCredentials_200_response'
          description: The ECR login credentials
      summary: Get ECR login credentials
      tags:
      - Applications
