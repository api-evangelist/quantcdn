    V2RuleProxyAction:
      example:
        cache_lifetime: '3600'
        proxy_strip_request_headers:
        - Cookie
        - Authorization
        application_proxy: false
        quant_cloud_selection:
          app: my-app
          container: web
          port: 80
          env: production
        application_container: web
        static_error_page: <html><body>Service temporarily unavailable</body></html>
        proxy_strip_headers:
        - Set-Cookie
        - Server
        notify_config:
          webhook_url: https://hooks.slack.com/services/XXXXXX
        notify: slack
        application_name: my-app
        auth_user: admin
        host: backend.test-domain.com
        waf_enabled: false
        proxy_inline_fn_enabled: false
        auth_pass: secure_password
        application_port: 80
        static_error_page_status_codes:
        - '500'
        - '502'
        - '503'
        - '504'
        failover_mode: true
        application_environment: production
        origin_timeout: '30'
        failover_origin_ttfb: '2000'
        only_proxy_404: false
        inject_headers:
          X-Custom-Header: value
          Authorization: Bearer token
        to: https://backend.test-domain.com
        disable_ssl_verify: false
        failover_lifetime: '300'
        waf_config:
          block_lists:
            referer: false
            ip: false
            ai: false
            user_agent: false
          allow_rules:
          - allow_rules
          - allow_rules
          httpbl:
            block_harvester: false
            httpbl_enabled: false
            block_spam: false
            httpbl_key: httpbl_key
            block_search_engine: false
            block_suspicious: false
          notify_slack_hits_rpm: 100
          allow_ip:
          - allow_ip
          - allow_ip
          block_asn:
          - block_asn
          - block_asn
          mode: report
          thresholds:
          - hits: 10
            mode: disabled
            rps: 10
            minutes: 5
            cooldown: 30
            type: ip
            value: value
            notify_slack: notify_slack
          - hits: 10
            mode: disabled
            rps: 10
            minutes: 5
            cooldown: 30
            type: ip
            value: value
            notify_slack: notify_slack
          notify_email:
          - notify_email
          - notify_email
          block_ip:
          - block_ip
          - block_ip
          block_referer:
          - block_referer
          - block_referer
          block_ua:
          - block_ua
          - block_ua
          notify_slack: https://hooks.slack.com/services/XXX
          paranoia_level: 1
        failover_origin_status_codes:
        - '200'
        - '404'
        - '301'
        - '302'
        - '304'
        proxy_alert_enabled: false
      properties:
        to:
          description: Target URL to proxy to
          example: https://backend.test-domain.com
          type: string
        host:
          description: Host header override
          example: backend.test-domain.com
          type: string
        auth_user:
          description: Basic auth username
          example: admin
          type: string
        auth_pass:
          description: Basic auth password
          example: secure_password
          type: string
        disable_ssl_verify:
          default: false
          description: Disable SSL verification
          example: false
          type: boolean
        cache_lifetime:
          description: Cache lifetime
          example: '3600'
          nullable: true
          type: string
        only_proxy_404:
          default: false
          description: Only proxy 404 responses
          example: false
          type: boolean
        inject_headers:
          additionalProperties:
            type: string
          description: Headers to inject
          example:
            X-Custom-Header: value
            Authorization: Bearer token
          nullable: true
          type: object
        proxy_strip_headers:
          description: Headers to strip from response
          example:
          - Set-Cookie
          - Server
          items:
            type: string
          type: array
        proxy_strip_request_headers:
          description: Headers to strip from request
          example:
          - Cookie
          - Authorization
          items:
            type: string
          type: array
        origin_timeout:
          description: Origin timeout
          example: '30'
          type: string
        failover_mode:
          default: false
          description: Enable failover mode
          example: true
          type: boolean
        failover_origin_ttfb:
          default: '2000'
          description: Failover TTFB threshold
          example: '2000'
          type: string
        failover_origin_status_codes:
          description: 'Status codes for failover (default: 200,404,301,302,304)'
          example:
          - '200'
          - '404'
          - '301'
          - '302'
          - '304'
          items:
            type: string
          type: array
        failover_lifetime:
          default: '300'
          description: Failover cache lifetime
          example: '300'
          type: string
        notify:
          default: none
          description: Notification type (none, slack)
          enum:
          - none
          - slack
          example: slack
          type: string
        notify_config:
          $ref: '#/components/schemas/V2RuleProxyAction_notify_config'
        waf_enabled:
          default: false
          description: WAF enabled
          example: false
          type: boolean
        waf_config:
          $ref: '#/components/schemas/WafConfig'
        proxy_alert_enabled:
          description: Proxy alert enabled
          example: false
          type: boolean
        proxy_inline_fn_enabled:
          default: false
