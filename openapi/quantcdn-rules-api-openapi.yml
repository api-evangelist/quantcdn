components:
  schemas:
    V2RuleBotChallengeAction:
      example:
        robot_challenge_type: invisible
        robot_challenge_verification_ttl: 10800
        robot_challenge_challenge_ttl: 30
      properties:
        robot_challenge_type:
          description: Challenge type (invisible or checkbox)
          example: invisible
          type: string
        robot_challenge_verification_ttl:
          default: 10800
          description: Verification TTL in seconds
          example: 10800
          type: integer
        robot_challenge_challenge_ttl:
          default: 30
          description: Challenge TTL in seconds
          example: 30
          type: integer
      required:
      - robot_challenge_type
      type: object
    V2RuleHeaderRequest:
      allOf:
      - $ref: '#/components/schemas/V2RuleRequest'
      - properties:
          headers:
            additionalProperties:
              type: string
            description: Headers to set
            example:
              X-Custom-Header: value
              Cache-Control: max-age=3600
            type: object
        required:
        - headers
        type: object
      example:
        country: country_is
        headers:
          X-Custom-Header: value
          Cache-Control: max-age=3600
        asn_is:
        - '15169'
        - '8075'
        method: method_is
        ip_is_not:
        - 172.16.0.0/12
        method_is:
