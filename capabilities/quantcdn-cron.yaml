naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Cron
  description: 'QuantCDN API — Cron. 7 operations. Lead operation: Get all cron jobs for an environment. Self-contained Naftiko
    capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Cron
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-cron
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Cron business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/cron
      operations:
      - name: listcronjobs
        method: GET
        description: Get all cron jobs for an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
      - name: createcronjob
        method: POST
        description: Create a new cron job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/cron/{cron}
      operations:
      - name: deletecronjob
        method: DELETE
        description: Delete a cron job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: cron
          in: path
          type: string
          description: The cron job ID
          required: true
      - name: getcronjob
        method: GET
        description: Get a cron job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: cron
          in: path
          type: string
          description: The cron job ID
          required: true
      - name: updatecronjob
        method: PATCH
        description: Update a cron job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: cron
          in: path
          type: string
          description: The cron job ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
