        mapping: $.
    - name: create-new-cron-job
      description: Create a new cron job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-cron.createcronjob
      with:
        organisation: tools.organisation
        application: tools.application
        environment: tools.environment
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-cron-job
