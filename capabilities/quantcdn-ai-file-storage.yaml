naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — AI File Storage
  description: 'QuantCDN API — AI File Storage. 4 operations. Lead operation: List Files. Self-contained Naftiko capability
    covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - AI File Storage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-ai-file-storage
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — AI File Storage business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-organizations-organisation-ai-files
      path: /api/v3/organizations/{organisation}/ai/files
      operations:
      - name: listfiles
        method: GET
        description: List Files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: filter
          in: query
          type: string
          description: JSON-encoded metadata filter. Supports exact match and array contains filters.
        - name: limit
          in: query
          type: integer
          description: Maximum files to return
        - name: cursor
          in: query
          type: string
          description: Pagination cursor from previous response
      - name: uploadfile
        method: POST
        description: Upload File to S3
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-ai-files-fileId
      path: /api/v3/organizations/{organisation}/ai/files/{fileId}
      operations:
      - name: deletefile
        method: DELETE
        description: Delete File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: fileId
          in: path
          type: string
          description: The file ID
          required: true
      - name: getfile
        method: GET
        description: Get File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: fileId
          in: path
          type: string
          description: The file ID
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-ai-file-storage-rest
    port: 8080
    description: REST adapter for QuantCDN API — AI File Storage. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/organizations/{organisation}/ai/files
      name: api-v3-organizations-organisation-ai-files
      description: REST surface for api-v3-organizations-organisation-ai-files.
      operations:
      - method: GET
        name: listfiles
        description: List Files
        call: quantcdn-ai-file-storage.listfiles
        with:
          organisation: rest.organisation
          filter: rest.filter
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: uploadfile
        description: Upload File to S3
        call: quantcdn-ai-file-storage.uploadfile
        with:
          organisation: rest.organisation
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/organizations/{organisation}/ai/files/{fileid}
      name: api-v3-organizations-organisation-ai-files-fileid
      description: REST surface for api-v3-organizations-organisation-ai-files-fileId.
      operations:
      - method: DELETE
        name: deletefile
        description: Delete File
        call: quantcdn-ai-file-storage.deletefile
        with:
          organisation: rest.organisation
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getfile
        description: Get File
        call: quantcdn-ai-file-storage.getfile
        with:
          organisation: rest.organisation
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-ai-file-storage-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — AI File Storage. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-files
      description: List Files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-ai-file-storage.listfiles
      with:
        organisation: tools.organisation
        filter: tools.filter
        limit: tools.limit
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-file-s3
      description: Upload File to S3
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-ai-file-storage.uploadfile
      with:
        organisation: tools.organisation
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-file
      description: Delete File
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-ai-file-storage.deletefile
      with:
        organisation: tools.organisation
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-file
      description: Get File
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-ai-file-storage.getfile
      with:
        organisation: tools.organisation
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
