naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Headers
  description: 'QuantCDN API — Headers. 3 operations. Lead operation: Delete custom headers. Self-contained Naftiko capability
    covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Headers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-headers
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Headers business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-organizations-organization-projects-project-custom-headers
      path: /api/v2/organizations/{organization}/projects/{project}/custom-headers
      operations:
      - name: headersdelete
        method: DELETE
        description: Delete custom headers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: headerslist
        method: GET
        description: List custom headers for a project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
      - name: headerscreate
        method: POST
        description: Create or update custom headers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-headers-rest
    port: 8080
    description: REST adapter for QuantCDN API — Headers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/custom-headers
      name: api-v2-organizations-organization-projects-project-custom-headers
      description: REST surface for api-v2-organizations-organization-projects-project-custom-headers.
      operations:
      - method: DELETE
        name: headersdelete
        description: Delete custom headers
        call: quantcdn-headers.headersdelete
        with:
          organization: rest.organization
          project: rest.project
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: headerslist
        description: List custom headers for a project
        call: quantcdn-headers.headerslist
        with:
          organization: rest.organization
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: headerscreate
        description: Create or update custom headers
        call: quantcdn-headers.headerscreate
        with:
          organization: rest.organization
          project: rest.project
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-headers-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — Headers. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: delete-custom-headers
      description: Delete custom headers
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-headers.headersdelete
      with:
        organization: tools.organization
        project: tools.project
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-custom-headers-project
      description: List custom headers for a project
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-headers.headerslist
      with:
        organization: tools.organization
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-custom-headers
      description: Create or update custom headers
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-headers.headerscreate
      with:
        organization: tools.organization
        project: tools.project
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
