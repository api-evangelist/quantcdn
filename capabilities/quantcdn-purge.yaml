naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Purge
  description: 'QuantCDN API — Purge. 1 operations. Lead operation: Purge cache via URL or cache keys. Self-contained Naftiko
    capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Purge
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-purge
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Purge business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-organizations-organization-projects-project-purge
      path: /api/v2/organizations/{organization}/projects/{project}/purge
      operations:
      - name: purgecreate
        method: POST
        description: Purge cache via URL or cache keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-purge-rest
    port: 8080
    description: REST adapter for QuantCDN API — Purge. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/purge
      name: api-v2-organizations-organization-projects-project-purge
      description: REST surface for api-v2-organizations-organization-projects-project-purge.
      operations:
      - method: POST
        name: purgecreate
        description: Purge cache via URL or cache keys
        call: quantcdn-purge.purgecreate
        with:
          organization: rest.organization
          project: rest.project
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-purge-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — Purge. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: purge-cache-url-cache-keys
      description: Purge cache via URL or cache keys
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-purge.purgecreate
      with:
        organization: tools.organization
        project: tools.project
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
