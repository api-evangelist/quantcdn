naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Environments
  description: 'QuantCDN API — Environments. 10 operations. Lead operation: Get all environments for an application. Self-contained
    Naftiko capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Environments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-environments
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Environments business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-organizations-organisation-applications-application-environments
      path: /api/v3/organizations/{organisation}/applications/{application}/environments
      operations:
      - name: listenvironments
        method: GET
        description: Get all environments for an application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
      - name: createenvironment
        method: POST
        description: Create a new environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}
      operations:
      - name: deleteenvironment
        method: DELETE
        description: Delete an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
      - name: getenvironment
        method: GET
        description: Get a single environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
      - name: updateenvironment
        method: PUT
        description: Update Environment Compose Definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/logs
      operations:
      - name: getenvironmentlogs
        method: GET
        description: Get the logs for an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: startTime
          in: query
          type: string
          description: Start time for log retrieval (ISO 8601 format or Unix timestamp)
        - name: endTime
          in: query
          type: string
          description: End time for log retrieval (ISO 8601 format or Unix timestamp)
        - name: containerName
          in: query
          type: string
          description: Filter logs by specific container name
        - name: filterPattern
          in: query
          type: string
          description: CloudWatch Logs filter pattern for searching log content
        - name: limit
          in: query
          type: integer
          description: Maximum number of log entries to return per page
        - name: nextToken
          in: query
          type: string
          description: Pagination token from previous response for retrieving next page of results
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/metrics
      operations:
      - name: getenvironmentmetrics
        method: GET
        description: Get the metrics for an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: startTime
          in: query
          type: integer
          description: Start time for metrics retrieval (Unix timestamp in milliseconds)
        - name: endTime
          in: query
          type: integer
          description: End time for metrics retrieval (Unix timestamp in milliseconds)
        - name: period
          in: query
          type: integer
          description: Period in seconds for metric aggregation (e.g., 60 for 1 minute, 300 for 5 minutes)
        - name: statistics
          in: query
          type: string
          description: Comma-separated list of CloudWatch statistics (e.g., Average, Maximum, Minimum, Sum, SampleCount)
        - name: containerName
          in: query
          type: string
          description: Filter metrics by specific container name
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/state
      operations:
      - name: updateenvironmentstate
        method: PUT
        description: Update the state of an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/sync/{type}
      operations:
      - name: listsyncoperations
        method: GET
        description: List the sync operations for an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: type
          in: path
          type: string
          description: The sync type
          required: true
      - name: synctoenvironment
        method: POST
        description: Perform a sync operation from a source environment to the current environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: type
          in: path
          type: string
          description: The sync type
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
