naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — KV
  description: 'QuantCDN API — KV. 11 operations. Lead operation: List key-value stores. Self-contained Naftiko capability
    covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - KV
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-kv
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — KV business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-organizations-organization-projects-project-kv
      path: /api/v2/organizations/{organization}/projects/{project}/kv
      operations:
      - name: kvlist
        method: GET
        description: List key-value stores
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
      - name: kvcreate
        method: POST
        description: Add a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-organizations-organization-projects-project-kv-store_id
      path: /api/v2/organizations/{organization}/projects/{project}/kv/{store_id}
      operations:
      - name: kvdelete
        method: DELETE
        description: Delete a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
      - name: kvshow
        method: GET
        description: Get a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
    - name: api-v2-organizations-organization-projects-project-kv-store_id-items
      path: /api/v2/organizations/{organization}/projects/{project}/kv/{store_id}/items
      operations:
      - name: kvitemslist
        method: GET
        description: List items in a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
        - name: cursor
          in: query
          type: string
          description: Cursor for pagination
        - name: limit
          in: query
          type: integer
          description: Number of items to return
        - name: search
          in: query
          type: string
          description: Search filter for keys
        - name: include_values
          in: query
          type: boolean
          description: Include values in the response. Secret values will be redacted as '[ENCRYPTED]' for security.
      - name: kvitemscreate
        method: POST
        description: Add an item to a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-organizations-organization-projects-project-kv-store_id-items-key
      path: /api/v2/organizations/{organization}/projects/{project}/kv/{store_id}/items/{key}
      operations:
      - name: kvitemsdelete
        method: DELETE
        description: Delete an item from a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
        - name: key
          in: path
          type: string
          required: true
      - name: kvitemsshow
        method: GET
        description: Get an item from a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
        - name: key
          in: path
          type: string
          required: true
      - name: kvitemsupdate
        method: PUT
        description: Update an item in a kv store
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          required: true
        - name: key
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-organizations-organization-projects-project-kv-store_id-link
      path: /api/v2/organizations/{organization}/projects/{project}/kv/{store_id}/link
      operations:
      - name: kvunlinkfromproject
        method: DELETE
        description: Unlink a KV store from this project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: store_id
          in: path
          type: string
          description: KV store identifier
          required: true
      - name: kvlinktoproject
        method: POST
        description: Link a KV store to another project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Source project identifier
          required: true
        - name: store_id
          in: path
          type: string
          description: KV store identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-kv-rest
    port: 8080
    description: REST adapter for QuantCDN API — KV. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/kv
      name: api-v2-organizations-organization-projects-project-kv
      description: REST surface for api-v2-organizations-organization-projects-project-kv.
      operations:
      - method: GET
        name: kvlist
        description: List key-value stores
        call: quantcdn-kv.kvlist
        with:
          organization: rest.organization
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: kvcreate
        description: Add a kv store
        call: quantcdn-kv.kvcreate
        with:
          organization: rest.organization
          project: rest.project
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/kv/{store-id}
      name: api-v2-organizations-organization-projects-project-kv-store-id
      description: REST surface for api-v2-organizations-organization-projects-project-kv-store_id.
      operations:
      - method: DELETE
        name: kvdelete
        description: Delete a kv store
        call: quantcdn-kv.kvdelete
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: kvshow
        description: Get a kv store
        call: quantcdn-kv.kvshow
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/kv/{store-id}/items
      name: api-v2-organizations-organization-projects-project-kv-store-id-items
      description: REST surface for api-v2-organizations-organization-projects-project-kv-store_id-items.
      operations:
      - method: GET
        name: kvitemslist
        description: List items in a kv store
        call: quantcdn-kv.kvitemslist
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          cursor: rest.cursor
          limit: rest.limit
          search: rest.search
          include_values: rest.include_values
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: kvitemscreate
        description: Add an item to a kv store
        call: quantcdn-kv.kvitemscreate
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/kv/{store-id}/items/{key}
      name: api-v2-organizations-organization-projects-project-kv-store-id-items-key
      description: REST surface for api-v2-organizations-organization-projects-project-kv-store_id-items-key.
      operations:
      - method: DELETE
        name: kvitemsdelete
        description: Delete an item from a kv store
        call: quantcdn-kv.kvitemsdelete
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: kvitemsshow
        description: Get an item from a kv store
        call: quantcdn-kv.kvitemsshow
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: kvitemsupdate
        description: Update an item in a kv store
        call: quantcdn-kv.kvitemsupdate
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          key: rest.key
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/organizations/{organization}/projects/{project}/kv/{store-id}/link
      name: api-v2-organizations-organization-projects-project-kv-store-id-link
      description: REST surface for api-v2-organizations-organization-projects-project-kv-store_id-link.
      operations:
      - method: DELETE
        name: kvunlinkfromproject
        description: Unlink a KV store from this project
        call: quantcdn-kv.kvunlinkfromproject
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: kvlinktoproject
        description: Link a KV store to another project
        call: quantcdn-kv.kvlinktoproject
        with:
          organization: rest.organization
          project: rest.project
          store_id: rest.store_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-kv-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — KV. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-key-value-stores
      description: List key-value stores
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-kv.kvlist
      with:
        organization: tools.organization
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: add-kv-store
      description: Add a kv store
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-kv.kvcreate
      with:
        organization: tools.organization
        project: tools.project
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-kv-store
      description: Delete a kv store
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-kv.kvdelete
      with:
        organization: tools.organization
        project: tools.project
        store_id: tools.store_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-kv-store
      description: Get a kv store
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-kv.kvshow
      with:
        organization: tools.organization
        project: tools.project
        store_id: tools.store_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-items-kv-store
      description: List items in a kv store
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-kv.kvitemslist
      with:
        organization: tools.organization
        project: tools.project
        store_id: tools.store_id
        cursor: tools.cursor
        limit: tools.limit
        search: tools.search
        include_values: tools.include_values
      outputParameters:
      - type: object
        mapping: $.
    - name: add-item-kv-store
      description: Add an item to a kv store
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-kv.kvitemscreate
      with:
        organization: tools.organization
        project: tools.project
        store_id: tools.store_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-item-kv-store
      description: Delete an item from a kv store
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-kv.kvitemsdelete
      with:
        organization: tools.organization
        project: tools.project
        store_id: tools.store_id
        key: tools.key
