naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Projects
  description: 'QuantCDN API — Projects. 5 operations. Lead operation: Retrieve all projects for an organization. Self-contained
    Naftiko capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-projects
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Projects business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-organizations-organization-projects
      path: /api/v2/organizations/{organization}/projects
      operations:
      - name: projectslist
        method: GET
        description: Retrieve all projects for an organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
      - name: projectscreate
        method: POST
        description: Create a new project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-organizations-organization-projects-project
      path: /api/v2/organizations/{organization}/projects/{project}
      operations:
      - name: projectsdelete
        method: DELETE
        description: Delete a project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
      - name: projectsread
        method: GET
        description: Get details of a single project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: with_token
          in: query
          type: boolean
          required: true
      - name: projectsupdate
        method: PATCH
        description: Update a project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization
          in: path
          type: string
          description: Organization identifier
          required: true
        - name: project
          in: path
          type: string
          description: Project identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-projects-rest
    port: 8080
    description: REST adapter for QuantCDN API — Projects. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/organizations/{organization}/projects
      name: api-v2-organizations-organization-projects
      description: REST surface for api-v2-organizations-organization-projects.
      operations:
      - method: GET
        name: projectslist
        description: Retrieve all projects for an organization
        call: quantcdn-projects.projectslist
        with:
          organization: rest.organization
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: projectscreate
        description: Create a new project
        call: quantcdn-projects.projectscreate
        with:
          organization: rest.organization
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/organizations/{organization}/projects/{project}
      name: api-v2-organizations-organization-projects-project
      description: REST surface for api-v2-organizations-organization-projects-project.
      operations:
      - method: DELETE
        name: projectsdelete
        description: Delete a project
        call: quantcdn-projects.projectsdelete
        with:
          organization: rest.organization
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: projectsread
        description: Get details of a single project
        call: quantcdn-projects.projectsread
        with:
          organization: rest.organization
          project: rest.project
          with_token: rest.with_token
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: projectsupdate
        description: Update a project
        call: quantcdn-projects.projectsupdate
        with:
          organization: rest.organization
          project: rest.project
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — Projects. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: retrieve-all-projects-organization
      description: Retrieve all projects for an organization
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-projects.projectslist
      with:
        organization: tools.organization
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-project
      description: Create a new project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-projects.projectscreate
      with:
        organization: tools.organization
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-project
      description: Delete a project
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-projects.projectsdelete
      with:
        organization: tools.organization
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: get-details-single-project
      description: Get details of a single project
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-projects.projectsread
      with:
        organization: tools.organization
        project: tools.project
        with_token: tools.with_token
      outputParameters:
      - type: object
        mapping: $.
    - name: update-project
      description: Update a project
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: quantcdn-projects.projectsupdate
      with:
        organization: tools.organization
        project: tools.project
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
