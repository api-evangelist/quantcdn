naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — Volumes
  description: 'QuantCDN API — Volumes. 4 operations. Lead operation: Get all volumes for an environment. Self-contained Naftiko
    capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - Volumes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-volumes
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — Volumes business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/volumes
      operations:
      - name: listvolumes
        method: GET
        description: Get all volumes for an environment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
      - name: createvolume
        method: POST
        description: Create a new volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v3-organizations-organisation-applications-application-environments-environm
      path: /api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/volumes/{volume}
      operations:
      - name: deletevolume
        method: DELETE
        description: Delete a volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: volume
          in: path
          type: string
          description: The volume ID
          required: true
      - name: getvolume
        method: GET
        description: Get a volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: application
          in: path
          type: string
          description: The application ID
          required: true
        - name: environment
          in: path
          type: string
          description: The environment ID
          required: true
        - name: volume
          in: path
          type: string
          description: The volume ID
          required: true
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-volumes-rest
    port: 8080
    description: REST adapter for QuantCDN API — Volumes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/volumes
      name: api-v3-organizations-organisation-applications-application-environments-environm
      description: REST surface for api-v3-organizations-organisation-applications-application-environments-environm.
      operations:
      - method: GET
        name: listvolumes
        description: Get all volumes for an environment
        call: quantcdn-volumes.listvolumes
        with:
          organisation: rest.organisation
          application: rest.application
          environment: rest.environment
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createvolume
        description: Create a new volume
        call: quantcdn-volumes.createvolume
        with:
          organisation: rest.organisation
          application: rest.application
          environment: rest.environment
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/organizations/{organisation}/applications/{application}/environments/{environment}/volumes/{volume}
      name: api-v3-organizations-organisation-applications-application-environments-environm
      description: REST surface for api-v3-organizations-organisation-applications-application-environments-environm.
      operations:
      - method: DELETE
        name: deletevolume
        description: Delete a volume
        call: quantcdn-volumes.deletevolume
        with:
          organisation: rest.organisation
          application: rest.application
          environment: rest.environment
          volume: rest.volume
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getvolume
        description: Get a volume
        call: quantcdn-volumes.getvolume
        with:
          organisation: rest.organisation
          application: rest.application
          environment: rest.environment
          volume: rest.volume
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-volumes-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — Volumes. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-all-volumes-environment
      description: Get all volumes for an environment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-volumes.listvolumes
      with:
        organisation: tools.organisation
        application: tools.application
        environment: tools.environment
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-volume
      description: Create a new volume
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantcdn-volumes.createvolume
      with:
        organisation: tools.organisation
        application: tools.application
        environment: tools.environment
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-volume
      description: Delete a volume
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantcdn-volumes.deletevolume
      with:
        organisation: tools.organisation
        application: tools.application
        environment: tools.environment
        volume: tools.volume
      outputParameters:
      - type: object
        mapping: $.
    - name: get-volume
      description: Get a volume
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-volumes.getvolume
      with:
        organisation: tools.organisation
        application: tools.application
        environment: tools.environment
        volume: tools.volume
      outputParameters:
      - type: object
        mapping: $.
