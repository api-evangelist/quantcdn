          type: string
          description: The organisation ID
          required: true
        - name: agentId
          in: path
          type: string
          description: The agent ID
          required: true
      - name: getaiagent
        method: GET
        description: Get Agent Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: agentId
          in: path
          type: string
          description: The agent ID
          required: true
      - name: updateaiagent
        method: PUT
        description: Update Agent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: agentId
          in: path
          type: string
          description: The agent ID
          required: true
