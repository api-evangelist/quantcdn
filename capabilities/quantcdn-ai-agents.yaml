      operations:
      - name: listaiagents
        method: GET
        description: List AI Agents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: group
          in: query
          type: string
          description: Optional group filter (e.g., 'development', 'compliance')
      - name: createaiagent
        method: POST
        description: Create AI Agent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
