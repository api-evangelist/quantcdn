naftiko: 1.0.0-alpha2
info:
  label: QuantCDN API — AI Monitoring
  description: 'QuantCDN API — AI Monitoring. 1 operations. Lead operation: Get AI usage statistics. Self-contained Naftiko
    capability covering one Quantcdn business surface.'
  tags:
  - Quantcdn
  - AI Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUANTCDN_API_KEY: QUANTCDN_API_KEY
capability:
  consumes:
  - type: http
    namespace: quantcdn-ai-monitoring
    baseUri: https://dashboard.quantcdn.io
    description: QuantCDN API — AI Monitoring business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-organizations-organisation-ai-usage
      path: /api/v3/organizations/{organisation}/ai/usage
      operations:
      - name: getaiusagestats
        method: GET
        description: Get AI usage statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organisation
          in: path
          type: string
          description: The organisation ID
          required: true
        - name: month
          in: query
          type: string
          description: Month to retrieve statistics for (YYYY-MM format)
    authentication:
      type: bearer
      token: '{{env.QUANTCDN_API_KEY}}'
  exposes:
  - type: rest
    namespace: quantcdn-ai-monitoring-rest
    port: 8080
    description: REST adapter for QuantCDN API — AI Monitoring. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v3/organizations/{organisation}/ai/usage
      name: api-v3-organizations-organisation-ai-usage
      description: REST surface for api-v3-organizations-organisation-ai-usage.
      operations:
      - method: GET
        name: getaiusagestats
        description: Get AI usage statistics
        call: quantcdn-ai-monitoring.getaiusagestats
        with:
          organisation: rest.organisation
          month: rest.month
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantcdn-ai-monitoring-mcp
    port: 9090
    transport: http
    description: MCP adapter for QuantCDN API — AI Monitoring. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-ai-usage-statistics
      description: Get AI usage statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantcdn-ai-monitoring.getaiusagestats
      with:
        organisation: tools.organisation
        month: tools.month
      outputParameters:
      - type: object
        mapping: $.
